<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數位協作</title>

<script src="https://unpkg.com/jspsych@8.2.1"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
<script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
<link rel="stylesheet"
 href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f5f7;
  color: #253144;
  font-family: system-ui, "Noto Sans TC", sans-serif;
}
.jspsych-content {
  width: 100%;
  max-width: 820px;
  padding: 16px;
  text-align: left;
  line-height: 1.75;
}
.card {
  background: white;
  padding: 28px;
  border-radius: 18px;
}
h1 { font-size: 25px; }
.muted { color: #697587; font-size: 14px; }
.chat {
  height: 84dvh;
  max-height: 850px;
  display: flex;
  flex-direction: column;
  background: white;
  border: 1px solid #e2e6ec;
  border-radius: 20px;
  overflow: hidden;
}
.header {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid #e9edf2;
}
.avatar {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: #e9eef8;
  color: #405a87;
  font-weight: bold;
}
.thread {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px;
}
.context {
  background: #f7f8fa;
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 14px;
  margin-bottom: 24px;
}
.context ul { padding-left: 20px; }
.row { display: flex; margin: 18px 0; }
.row.you { justify-content: flex-end; }
.message { max-width: 88%; }
.label {
  font-size: 12px;
  color: #697587;
  margin-bottom: 5px;
}
.you .label { text-align: right; }
.bubble {
  background: #f0f2f6;
  padding: 13px 17px;
  border-radius: 16px 16px 16px 4px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.you .bubble {
  background: #e6efff;
  border-radius: 16px 16px 4px 16px;
}
.composer {
  border-top: 1px solid #e9edf2;
  padding: 14px 18px;
  background: white;
}
.input-row { display: flex; gap: 10px; align-items: flex-end; }
textarea {
  flex: 1;
  min-width: 0;
  height: 76px;
  max-height: 180px;
  padding: 12px;
  border: 1px solid #cbd3df;
  border-radius: 12px;
  resize: vertical;
  font: inherit;
}
textarea:focus { outline: 2px solid #b8cef0; }
button {
  padding: 11px 18px;
  border: 0;
  border-radius: 10px;
  background: #345d94;
  color: white;
  font: inherit;
  cursor: pointer;
}
button:disabled { opacity: .45; cursor: default; }
.hint { font-size: 12px; color: #697587; margin-top: 8px; }
#complete { margin-top: 12px; }
@media (max-width: 600px) {
  .jspsych-content { padding: 8px; }
  .chat { height: 92dvh; border-radius: 12px; }
  .thread { padding: 14px; }
  .composer { padding: 12px; }
}
</style>
</head>

<body>
<div id="experiment">正在載入……</div>

<script>
const subject_id = crypto.randomUUID();
const filename = `${subject_id}.csv`;

const jsPsych = initJsPsych({
  display_element: "experiment",
  extensions: [{
    type: jsPsychExtensionPipe,
    params: {
      experiment_id: "wgt5prIcjVof",
      filename: () => filename
    }
  }],
  on_finish: () => {
    document.getElementById("experiment").innerHTML = `
      <div class="jspsych-content">
        <div class="card">
          <h1>聊天測試完成</h1>
          <p>請到 Google Drive 確認本次回答是否保存。</p>
          <p class="muted">
            此畫面表示作答完成，不代表已確認雲端保存成功。
          </p>
          <p id="file"></p>
          <button id="backup">下載 CSV 備份</button>
        </div>
      </div>`;
    document.getElementById("file").textContent = filename;
    document.getElementById("backup").onclick = () =>
      jsPsych.data.get().localSave("csv", filename);
  }
});

jsPsych.data.addProperties({
  subject_id,
  study_version: "s06-chat-test-v1",
  data_category: "platform_test",
  started_at: new Date().toISOString()
});

const intro = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="card">
      <p class="muted">聊天介面測試｜一個情境</p>
      <h1>數位協作</h1>
      <p>你會看到一段既有聊天紀錄。
         閱讀後，請在訊息框寫下你會傳送的回覆。</p>
      <p>本次協作者訊息為預先設定，
         不會根據你的回答即時生成新訊息。</p>
      <p>這是平台測試，回答會保存至研究者的儲存空間。
         請勿輸入私人資訊。</p>
    </div>`,
  choices: ["進入對話"],
  data: { stage: "introduction" }
};

const chatTrial = {
  type: jsPsychHtmlButtonResponse,
  choices: [],
  stimulus: `
    <section class="chat">
      <header class="header">
        <div class="avatar">N</div>
        <div>
          <strong>Nova</strong>
          <div class="muted">AI 協作者</div>
        </div>
      </header>

      <div class="thread" id="thread">
        <div class="context">
          <strong>目前任務：整理分享會介紹</strong>
          <p>你已有三個重點，請 Nova 協助潤飾：</p>
          <ul>
            <li>工作流程：用數位工具減少重複作業。</li>
            <li>團隊合作：讓成員更容易分享資訊與協調進度。</li>
            <li>未來技能：學習判斷工具的限制，並檢查產出。</li>
          </ul>
        </div>

        <div class="row you">
          <div class="message">
            <div class="label">你・先前的訊息</div>
            <div class="bubble">請保留三個條列，每點一句話，不要合併成段落。</div>
          </div>
        </div>

        <div class="row">
          <div class="message">
            <div class="label">Nova</div>
            <div class="bubble" id="nova" aria-live="polite">正在輸入……</div>
          </div>
        </div>

        <div id="sent-message"></div>
      </div>

      <div class="composer">
        <form id="message-form">
          <div class="input-row">
            <textarea id="reply" maxlength="5000"
              placeholder="等待協作者回覆……"
              aria-label="輸入訊息" disabled></textarea>
            <button id="send" type="submit" disabled>傳送</button>
          </div>
        </form>
        <div class="hint" id="hint">
          Enter 換行；按「傳送」送出訊息。
        </div>
        <button id="complete" hidden>完成測試</button>
      </div>
    </section>`,
  data: {
    stage: "scenario_response",
    scenario_id: "S06",
    scenario_version: "s06-revised-v1",
    target_type: "AI",
    collaborator_name: "Nova",
    interface_type: "chat",
    typing_delay_ms: 1000
  },
  on_load: () => {
    const trialStart = performance.now();
    const thread = document.getElementById("thread");
    const input = document.getElementById("reply");
    const send = document.getElementById("send");
    const complete = document.getElementById("complete");

    let replyShownAt;
    let firstInputAt = null;
    let result = null;

    // 固定延遲；正式 A/B 版兩種身分將使用相同設定。
    jsPsych.pluginAPI.setTimeout(() => {
      document.getElementById("nova").textContent =
        "這場分享會將介紹如何運用數位工具減少重複作業，" +
        "讓團隊更容易分享資訊與協調進度，並探討如何判斷工具的限制與檢查產出。";
      replyShownAt = performance.now();
      input.disabled = false;
      input.placeholder = "輸入訊息……";
      thread.scrollTop = thread.scrollHeight;
    }, 1000);

    input.addEventListener("input", () => {
      if (firstInputAt === null && input.value.length > 0) {
        firstInputAt = performance.now();
      }
      send.disabled = input.value.trim().length === 0;
    });

    document.getElementById("message-form")
      .addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text || result || replyShownAt === undefined) return;

        const sentAt = performance.now();
        result = {
          reply_text: text,
          rt: Math.round(sentAt - trialStart),
          response_rt_ms: Math.round(sentAt - replyShownAt),
          first_input_latency_ms: firstInputAt === null
            ? null : Math.round(firstInputAt - replyShownAt),
          composition_ms: firstInputAt === null
            ? null : Math.round(sentAt - firstInputAt),
          submitted_at: new Date().toISOString()
        };

        // 使用 textContent，回答只當文字顯示。
        const row = document.createElement("div");
        row.className = "row you";
        const message = document.createElement("div");
        message.className = "message";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = "你";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        message.append(label, bubble);
        row.append(message);
        document.getElementById("sent-message").append(row);

        input.disabled = true;
        send.disabled = true;
        document.getElementById("hint").textContent =
          "訊息已送出。請按「完成測試」繼續。";
        complete.hidden = false;
        thread.scrollTop = thread.scrollHeight;
      });

    complete.addEventListener("click", () => {
      if (!result) return;
      complete.disabled = true;
      jsPsych.finishTrial({
        ...result,
        trial_duration_ms: Math.round(performance.now() - trialStart)
      });
    });
  }
};

jsPsych.run([intro, chatTrial]);
</script>
</body>
</html>
