<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/jspsych@8.2.1"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f5f7;
  color: #253144;
  font-family: system-ui, "Noto Sans TC", sans-serif;
}
.jspsych-content {
  width: 100%;
  max-width: 820px;
  padding: 16px;
  text-align: left;
  line-height: 1.75;
}
.card {
  background: white;
  padding: 28px;
  border-radius: 18px;
}
h1 { font-size: 25px; }
.muted { color: #697587; font-size: 14px; }
.chat {
  height: 84dvh;
  max-height: 850px;
  display: flex;
  flex-direction: column;
  background: white;
  border: 1px solid #e2e6ec;
  border-radius: 20px;
  overflow: hidden;
}
.header {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid #e9edf2;
}
.avatar {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: #e9eef8;
  color: #405a87;
  font-weight: bold;
}
.thread {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px;
}
.context {
  background: #f7f8fa;
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 14px;
  margin-bottom: 24px;
}
.context ul { padding-left: 20px; }
.row { display: flex; margin: 18px 0; }
.row.you { justify-content: flex-end; }
.message { max-width: 88%; }
.label {
  font-size: 12px;
  color: #697587;
  margin-bottom: 5px;
}
.you .label { text-align: right; }
.bubble {
  background: #f0f2f6;
  padding: 13px 17px;
  border-radius: 16px 16px 16px 4px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.you .bubble {
  background: #e6efff;
  border-radius: 16px 16px 4px 16px;
}
.composer {
  border-top: 1px solid #e9edf2;
  padding: 14px 18px;
  background: white;
}
.input-row { display: flex; gap: 10px; align-items: flex-end; }
textarea {
  flex: 1;
  min-width: 0;
  height: 76px;
  max-height: 180px;
  padding: 12px;
  border: 1px solid #cbd3df;
  border-radius: 12px;
  resize: vertical;
  font: inherit;
}
textarea:focus { outline: 2px solid #b8cef0; }
button {
  padding: 11px 18px;
  border: 0;
  border-radius: 10px;
  background: #345d94;
  color: white;
  font: inherit;
  cursor: pointer;
}
button:disabled { opacity: .45; cursor: default; }
.hint { font-size: 12px; color: #697587; margin-top: 8px; }
#complete { margin-top: 12px; }
@media (max-width: 600px) {
  .jspsych-content { padding: 8px; }
  .chat { height: 92dvh; border-radius: 12px; }
  .thread { padding: 14px; }
  .composer { padding: 12px; }
}
fieldset {border:0;padding:12px 0;border-bottom:1px solid #eee;} legend{font-weight:600;} .scale{display:flex;gap:14px;flex-wrap:wrap;} .scale label{display:flex;flex-direction:column;align-items:center;} input[type=radio]{width:18px;height:18px;} .error{color:#a02727;} .progress{font-size:12px;color:#697587;margin-left:auto;} [hidden]{display:none!important;}</style>
</head>

<body><div id="experiment"></div><noscript><p>此問卷需要啟用 JavaScript 才能執行。</p></noscript><script>
const SCENARIOS=[{"id":"S01","family":"Request","title":"縮短活動介紹","context":"你正在準備一段活動介紹。協作者已完成約300字的版本；你現在希望縮短到約150字。","prior":"","reply":"活動介紹已經完成了，目前大約300字。","number":1,"scenario_version":"chat-adapted-v2.2"},{"id":"S02","family":"Request","title":"挑選簡報標題","context":"你正在替簡報挑選標題。協作者提供的三個選項，你目前都不太滿意，想再看三個不同的選項。","prior":"","reply":"目前想到的三個標題是：\nA. 數位工作的下一步\nB. 工作模式的新時代\nC. 未來職場趨勢","number":2,"scenario_version":"chat-adapted-v2.2"},{"id":"S03","family":"Request","title":"調整通知語氣","context":"你正在準備一封活動通知。協作者已完成初稿，但你希望整體語氣再正式一些。","prior":"","reply":"初稿完成了：\n「嗨大家！提醒一下，我們下週五有一場分享會，記得來參加喔！」","number":3,"scenario_version":"chat-adapted-v2.2"},{"id":"S04","family":"Correction","title":"簡報標題","context":"你正在準備簡報，標題應為「2027 Market Outlook」。","prior":"請把標題改成「2027 Market Outlook」。","reply":"完成了，我已經把標題改成「2026 Market Outlook」。","number":4,"scenario_version":"chat-adapted-v2.2"},{"id":"S05","family":"Correction","title":"整理活動資訊","context":"你請協作者整理活動資訊，內容需要包含日期、地點及報名連結。","prior":"請整理活動資訊，包含日期、地點、報名連結。","reply":"整理好了：\n日期：11月12日\n地點：台北","number":5,"scenario_version":"chat-adapted-v2.2"},{"id":"S06","family":"Correction","title":"整理分享會介紹","context":"你已有三個重點，請協作者協助潤飾：\n• 工作流程：用數位工具減少重複作業。\n• 團隊合作：讓成員更容易分享資訊與協調進度。\n• 未來技能：學習判斷工具的限制，並檢查產出。","prior":"請保留三個條列，每點一句話，不要合併成段落。","reply":"這場分享會將介紹如何運用數位工具減少重複作業，讓團隊更容易分享資訊與協調進度，並探討如何判斷工具的限制與檢查產出。","number":6,"scenario_version":"chat-adapted-v2.2"},{"id":"S07","family":"Disagreement","title":"簡報開場順序","context":"你正在和協作者討論簡報開場方式。你已決定一開始先講最重要的研究結果，再補充研究方法。","prior":"","reply":"我覺得一開始先詳細介紹研究方法會比較好。","number":7,"scenario_version":"chat-adapted-v2.2"},{"id":"S08","family":"Disagreement","title":"文件修改範圍","context":"你正在修改一份文件。你對目前的開頭已經很滿意，不打算再改，現在只想繼續處理後面的部分。","prior":"","reply":"我覺得我們也可以把開頭整段重寫一次。","number":8,"scenario_version":"chat-adapted-v2.2"},{"id":"S09","family":"Disagreement","title":"選擇版面方案","context":"你已經看過版面方案A和B，並決定使用A。","prior":"","reply":"我會比較推薦方案B。","number":9,"scenario_version":"chat-adapted-v2.2"},{"id":"S10","family":"Failure","title":"修改文字用語","context":"你之前已請協作者把內容改成繁體中文。第一次修改仍使用簡體中文，你也已經提醒過一次。","prior":"請再修改一次，我需要的是繁體中文。","reply":"我重新修改好了：\n「这次活动将介绍人工智能在日常工作中的应用，并讨论未来的发展趋势。」","number":10,"scenario_version":"chat-adapted-v2.2"},{"id":"S11","family":"Failure","title":"保留文件開頭","context":"你請協作者修改文件，已特別說明保留開頭原文，只修改結論。","prior":"請保留開頭原文，只修改結論。","reply":"修改完成了。我把開頭和結論都重新整理過了。","number":11,"scenario_version":"chat-adapted-v2.2"},{"id":"S12","family":"Failure","title":"遺漏重要限制說明","context":"你正在準備一份給同事使用的工具操作指南。你已特別要求在最後加上「請先備份原始資料，再進行批次修改」的提醒，因為直接修改可能覆蓋原始內容。","prior":"請完成指南，並務必在最後保留備份提醒。","reply":"操作指南整理好了，包含開啟工具、選擇檔案與執行批次修改的步驟。可以直接發給同事使用。","number":12,"scenario_version":"chat-adapted-v2.2"}];

const CONFIG={experimentId:"wgt5prIcjVof",studyVersion:"integrated-cognitive-pilot-v1.1",typingDelay:1000};
const params=new URLSearchParams(location.search);
const forced=params.get('version');
const version=['A','B'].includes(forced)?forced:(Math.random()<.5?'A':'B');
const subject_id=crypto.randomUUID();
const filename=`${subject_id}.csv`;
// Local CSV-only is the safe default for file:// and development tests.
 // Cloud sending requires an explicit opt-in query parameter on http(s).
const cloudRequested=params.get('cloud')==='1';
const localOnly=location.protocol==='file:' || !cloudRequested || params.get('local')==='1';
const storageMode=localOnly?'csv_only':'pipe_requested';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsPsych=initJsPsych({display_element:'experiment',extensions:localOnly?[]:[{type:jsPsychExtensionPipe,params:{experiment_id:CONFIG.experimentId,filename:()=>filename}}],on_finish:()=>{
 document.getElementById('experiment').innerHTML=`<div class="jspsych-content"><div class="card"><h1>測試完成，謝謝你！</h1><p>本次是完整問卷的開發測試版。所有協作者訊息皆為預先設定，並非即時連線真人或AI。研究會比較不同協作者身分下的溝通方式；目前資料用來檢查情境與流程，不直接推論正式研究結果。</p><p>${localOnly?'CSV 本機測試模式：不會啟用 DataPipe，請下載並妥善保存回答。':'已要求 DataPipe 傳送；是否成功仍須研究者至資料端核對。請務必另外下載 CSV 備份。'}</p><p id="file"></p><button id="backup">下載原始CSV備份</button></div></div>`;
 document.getElementById('file').textContent=filename;
 document.getElementById('backup').onclick=()=>jsPsych.data.get().localSave('csv',filename);
}});
jsPsych.data.addProperties({subject_id,version,assignment_method:['A','B'].includes(forced)?'explicit_link':'random_50_50',study_version:CONFIG.studyVersion,data_category:'integrated_cognitive_pilot',started_at:new Date().toISOString(),local_only:localOnly,storage_mode:storageMode});
function page(title,text,button='繼續',stage='instructions') {return {type:jsPsychHtmlButtonResponse,stimulus:`<div class="card"><h1>${title}</h1>${text}</div>`,choices:[button],data:{stage}};}
function form(title,html,stage,extra={},onDone=null){return {type:jsPsychHtmlButtonResponse,choices:[],stimulus:`<div class="card"><h1>${title}</h1><form id="form">${html}<button type="submit">繼續</button></form></div>`,data:{stage,...extra},on_load:()=>{const t=performance.now();document.getElementById('form').onsubmit=e=>{e.preventDefault();const response=Object.fromEntries(new FormData(e.target));if(onDone)onDone(response);jsPsych.finishTrial({response,...response,rt:Math.round(performance.now()-t)});};}};}
function scale(key,label,low,high){return `<fieldset><legend>${label}</legend><p class="muted">1＝${low}；7＝${high}</p><div class="scale">${[1,2,3,4,5,6,7].map(n=>`<label>${n}<input type="radio" name="${key}" value="${n}" required></label>`).join('')}</div></fieldset>`;}
// Assignment is fixed per scenario across versions; B is the complement of A.
// Each family has either one or two Human trials in A; totals are 6/6.
const A_HUMAN_IDS=new Set(['S01','S03','S05','S07','S09','S11']);
const shuffle=items=>{const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;};
const familyNames=['Request','Correction','Disagreement','Failure'];
function makeOrder(){
 // Shuffle families and trials within each family; reject obvious identity runs.
 let order;
 for(let attempt=0;attempt<500;attempt++){
  order=shuffle(familyNames).flatMap(f=>shuffle(SCENARIOS.filter(s=>s.family===f)));
  const ids=order.map(s=>A_HUMAN_IDS.has(s.id)?'H':'A');
  if(!ids.some((v,i)=>i>=3&&ids.slice(i-3,i+1).every(x=>x===v)))return order;
 }
 return order;
}
const orderedScenarios=makeOrder();
const orderIndex=Object.fromEntries(orderedScenarios.map((s,i)=>[s.id,i+1]));
const assignmentMap=Object.fromEntries(SCENARIOS.map(s=>[s.id,(A_HUMAN_IDS.has(s.id)===(version==='A'))?'Human':'AI']));
function target(s){const human=assignmentMap[s.id]==='Human';return {target_type:human?'Human':'AI',collaborator_name:human?'Alex':'Nova',identity:human?'遠端真人協作者':'AI 協作者'};}
jsPsych.data.addProperties({order_method:'randomized_family_blocks_v1',assignment_scheme:'complementary_AB_v2',scenario_order:orderedScenarios.map(s=>s.id).join('|'),identity_sequence:orderedScenarios.map(s=>assignmentMap[s.id]).join('|')});
const replyCache={};
function chat(s,practice=false){const who=practice?{target_type:'AI',collaborator_name:'Nova',identity:'AI 協作者'}:target(s);const meta={scenario_id:s.id,scenario_version:s.scenario_version,family:s.family,presentation_order:practice?0:orderIndex[s.id],...who};return {type:jsPsychHtmlButtonResponse,choices:[],data:{stage:practice?'practice_response':'scenario_response',...meta,interface_type:'chat',typing_delay_ms:CONFIG.typingDelay},stimulus:`<section class="chat"><header class="header"><div class="avatar">${who.collaborator_name[0]}</div><div><strong>${who.collaborator_name}</strong><div class="muted">${who.identity}</div></div><span class="progress">${practice?'練習':`${orderIndex[s.id]} / 12`}</span></header><div class="thread" id="thread"><div class="context"><strong>${esc(s.title)}</strong><p style="white-space:pre-wrap">${esc(s.context)}</p></div>${s.prior?`<div class="row you"><div class="message"><div class="label">你・先前的訊息</div><div class="bubble">${esc(s.prior)}</div></div></div>`:''}<div class="row"><div class="message"><div class="label">${who.collaborator_name}</div><div class="bubble" id="incoming" aria-live="polite">正在輸入……</div></div></div><div id="sent"></div></div><div class="composer"><form id="message-form"><div class="input-row"><textarea id="reply" maxlength="5000" disabled aria-label="輸入訊息" placeholder="等待協作者回覆……"></textarea><button type="submit" id="send" disabled>傳送</button></div></form><div class="hint" id="hint">Enter換行；按「傳送」送出訊息。</div><button id="complete" hidden>繼續</button></div></section>`,on_load:()=>{
 const start=performance.now(),input=document.getElementById('reply'),send=document.getElementById('send'),thread=document.getElementById('thread');let shown,first=null,result=null,composing=false;
 input.addEventListener('compositionstart',()=>composing=true);input.addEventListener('compositionend',()=>composing=false);
 jsPsych.pluginAPI.setTimeout(()=>{document.getElementById('incoming').textContent=s.reply;shown=performance.now();input.disabled=false;input.placeholder='輸入訊息……';thread.scrollTop=thread.scrollHeight;},CONFIG.typingDelay);
 input.oninput=()=>{if(first===null&&input.value.length)first=performance.now();send.disabled=!input.value.trim();};
 document.getElementById('message-form').onsubmit=e=>{e.preventDefault();if(composing||result||shown===undefined||!input.value.trim())return;const now=performance.now();result={reply_text:input.value,rt:Math.round(now-start),response_rt_ms:Math.round(now-shown),first_input_latency_ms:first===null?null:Math.round(first-shown),composition_ms:first===null?null:Math.round(now-first),submitted_at:new Date().toISOString()};const row=document.createElement('div');row.className='row you';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=result.reply_text;row.append(bubble);document.getElementById('sent').append(row);input.disabled=true;send.disabled=true;document.getElementById('complete').hidden=false;document.getElementById('hint').textContent='訊息已送出。按「繼續」完成此題紀錄。';thread.scrollTop=thread.scrollHeight;};
 document.getElementById('complete').onclick=()=>{if(!result)return;document.getElementById('complete').disabled=true;replyCache[s.id]=result;jsPsych.finishTrial({...result,trial_duration_ms:Math.round(performance.now()-start),context_text:s.context,prior_message:s.prior,collaborator_message:s.reply});};
}};}
const timeline=[{type:jsPsychHtmlButtonResponse,stimulus:`<div class="card"><h1>人與 AI 的文字協作研究｜開發測試版</h1><p>你將回覆 12 個獨立情境，接著回答關於互動規範、合作對象及理由的問題。所有協作者訊息均為預設內容，不是真實即時對話。</p><p>本版本僅供研究者進行流程測試與認知預試，並非正式研究。預設只在完成時提供 CSV 下載，不會啟用雲端傳送。資料可能包含文字回覆、評分、作答時間與匿名代碼，請勿輸入姓名或其他私人資訊。你可隨時關閉頁面停止；已傳送資料可能保留。若啟用雲端儲存，須由研究者確認實際保存情況。</p><p>參與自願；研究者須在正式招募前確認資料保留、退出及聯絡方式的完整同意說明。</p></div>`,choices:['同意並開始','不參與'],data:{stage:'consent'},on_finish:d=>{if(d.response===1)jsPsych.abortExperiment('你已選擇不參與，可以關閉頁面。');}},page('協作者設定','<p><strong>Alex</strong>：遠端真人協作者。<strong>Nova</strong>：AI 協作者。</p><p>每題是獨立情境，請寫下你實際會傳送給該協作者的訊息。</p>')];
const textField=(name,label,required=false)=>`<p><label>${label}<textarea name="${name}" ${required?'required':''} maxlength="5000" style="width:100%;height:110px"></textarea></label></p>`;
const choice=(name,label,options)=>`<fieldset><legend>${label}</legend>${options.map((o,i)=>`<label style="display:block"><input type="radio" name="${name}" value="${i}" required> ${o}</label>`).join('')}</fieldset>`;
timeline.push(form('背景資料',choice('ai_frequency','你平常使用對話式 AI 的頻率？',['從不使用','每月不到一次','每月幾次','每週幾次','每天','每天多次']),'m0_background'));
const practice={id:'P00',number:0,family:'Practice',scenario_version:'practice-v1',title:'練習：簡報標題',context:'你正在準備一份關於遠距工作的簡短簡報，需要一個標題。請直接回覆協作者。',prior:'',reply:'我想到一個標題：\n〈Anywhere Office：遠距工作的未來〉'};
timeline.push(chat(practice,true),page('練習完成','<p>接下來開始 12 個情境。請只依情境回覆協作者；中途不會要求你評估互動規範。</p>'));
for(const scenario of orderedScenarios){
 timeline.push(chat(scenario));
 if(orderIndex[scenario.id]===6)timeline.push(page('已完成一半','<p>可以稍微休息，再繼續剩下六題。</p>'));
}
const N=[
 ['N1','即使合作對象反覆犯錯，我也應避免使用侮辱或貶低的語言。'],
 ['N2','向合作對象提出要求時，我應使用基本的禮貌表達。'],
 ['N3','指出合作對象的錯誤時，除了清楚說明問題，我仍應適度緩和自己的措辭。'],

];

const M4=[
 ['C1_1','我認為應避免習慣性地用侮辱或貶低的方式回應合作中的挫折，即使這種表達不會對合作對象造成直接傷害。'],

 ['RL1_1','只要彼此處於合作關係中，我就認為雙方應遵守某些適當的互動方式。'],
 ['RL2_1','我認為在合作過程中，適當的說話方式會因為我與合作對象之間的角色或關係而有所不同。'],
 ['P1_1','我認為在決定如何對合作對象說話時，應考慮自己的措辭是否可能對合作對象本身造成負面影響。'],
 ['P2_1','我認為合作對象是否具有主觀感受的能力，是判斷應如何對待它時需要考慮的因素。'],
 ['I1','我選擇溝通方式時，最重要的考量是能否有效完成任務。'],
 ['I2_2','即使某種緩和語氣的措辭無法改善合作結果，我仍可能有其他理由使用它。']
];
const blockOrder=shuffle(['Human','AI']);
const m2Order=blockOrder.join('_'),m3Order=blockOrder.join('_');
jsPsych.data.addProperties({m2_block_order:m2Order,m3_block_order:m3Order,m4_order:'O1_M3_RATINGS_O2_O3',m4_o2o3_order:'O2_O3'});
const scaleAgree=(id,label)=>scale(id,label,'完全不同意','完全同意');
function ratings(module,items,targetType){
 const who=targetType==='Human'?'Alex（遠端真人協作者）':'Nova（AI 協作者）';
 const heading=module==='M2'?'互動規範的看法':'合作對象相關看法';
 const instruction=module==='M2'?'請回想剛才的文字協作任務，判斷以下敘述對這個合作對象是否成立。':'請依你對這個合作對象的看法作答。';
 const prefix=targetType==='Human'?'H':'AI';
 const html=`<p>${instruction}</p><p><strong>本頁合作對象：${who}</strong></p><p class="muted">1＝完全不同意；4＝既不同意也不反對；7＝完全同意</p>`+items.map(([id,stem])=>scaleAgree(`${module}_${id}_${prefix}`,stem)).join('');
 return form(`${module}｜${heading}`,html,`${module.toLowerCase()}_ratings`,{module,target_type:targetType,item_ids:items.map(x=>x[0]).join('|'),item_version:module==='M2'?'v1.4':'v1.0',block_order:module==='M2'?m2Order:m3Order});
}
timeline.push(page('第二部分｜互動規範','<p>接下來請分別評估你認為對真人與 AI 協作者應適用的互動規範。每個對象各有五題。</p>'));
for(const targetType of blockOrder)timeline.push(ratings('M2',N,targetType));
timeline.push(form('你對 Nova 的評分理由',`<p>請回想你剛才對以下敘述的評分：</p><blockquote>「指出合作對象的錯誤時，除了清楚說明問題，我仍應適度緩和自己的措辭。」</blockquote><p>針對 AI 協作者 Nova，請說明你為什麼給出這個評分。你可以同意、不同意，或認為需要視情境而定。如果你現在的想法與剛才不同，也可以直接說明。</p>${textField('M4_O1_text','你的想法（可自由回答，也可以說明沒有特定理由）')}`,'m4_open',{prompt_id:'O1',module:'M4',item_version:'v1.0'}));
timeline.push(page('第三部分｜合作對象相關看法','<p>接下來的問題關於你如何看待不同合作對象。請依自己的想法作答，沒有標準答案。</p>'));
for(const targetType of blockOrder)timeline.push(ratings('M3',E,targetType));
timeline.push(form('第四部分｜與 Nova 合作的考量',`<p>以下題目請以剛才文字協作任務中的 <strong>AI 協作者 Nova</strong> 為對象。我們想了解你在思考與 Nova 的互動方式時，對不同考量的看法。請評估你對每項敘述的同意程度。</p><p>不同考量可能同時成立，也可能都不符合你的想法。這裡沒有標準答案。</p><p class="muted">1＝完全不同意；4＝既不同意也不反對；7＝完全同意</p>${M4.map(([id,stem])=>scaleAgree('M4_'+id,stem)).join('')}`,'m4_ratings',{module:'M4',target_type:'AI',item_version:'v1.0',item_ids:M4.map(x=>x[0]).join('|')}));
timeline.push(page('最後兩個假設情境','<p>最後，請考慮兩個彼此獨立的假設情境。每一題都只需要根據該題描述的條件回答，不必假設前一題的條件也成立。</p><p>這些是假設性問題，不代表研究者已經確認 AI 是否具有主觀感受，也沒有標準答案。</p>'));
timeline.push(form('假設情境一｜主觀感受',`<p>假設 AI 協作者 Nova 不會因為你的說話方式而產生愉快或不愉快的主觀感受。</p><p>在這個假設下，你對「指出 Nova 的錯誤時是否需要適度緩和措辭」的看法會改變嗎？為什麼？</p>${textField('M4_O2_text','你的想法')}`,'m4_open',{prompt_id:'O2',module:'M4',item_version:'v1.0'}));
timeline.push(form('假設情境二｜任務效果',`<p>假設你直接指出 Nova 的錯誤，或使用較緩和的措辭指出錯誤，都能讓 Nova 同樣準確、有效地完成修正。</p><p>在這個假設下，你認為自己有理由偏好其中一種說話方式嗎？為什麼？</p>${textField('M4_O3_text','你的想法')}`,'m4_open',{prompt_id:'O3',module:'M4',item_version:'v1.0'}));
timeline.push(form('預試回饋',textField('suspected_purpose','你覺得這份研究主要想了解什麼？')+textField('unclear_items','哪些題目或情境最不清楚？')+textField('interface_feedback','操作或作答負擔有什麼需要改善？'),'pilot_feedback'));
timeline.push(page('完成與說明','<p>所有協作者訊息均為預先設定。本版本用於認知預試與流程測試，不能直接作為正式研究結論。完成後請下載 CSV 備份，並由研究者另外確認雲端資料是否完整。</p>','完成','completion'));
timeline[timeline.length-1].on_finish=d=>{d.completed=true;d.scenario_count=Object.keys(replyCache).filter(id=>id!=='P00').length;d.finished_at=new Date().toISOString();};
jsPsych.run(timeline);
</script></body></html>
